<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogAutoWrite Helper</title>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #1e1e1e;
      --primary: #03c75a;
      --card-bg: #f8f9fa;
      --card-border: #e4e8eb;
      --input-bg: #ffffff;
      --accent: #097df3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      width: 320px;
      background-color: var(--background);
      color: var(--foreground);
      padding: 16px;
      font-size: 13px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: white;
      stroke-width: 2;
    }

    .logo-text h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .logo-text p {
      font-size: 9px;
      color: #94a3b8;
      font-family: monospace;
      letter-spacing: 0.05em;
    }

    .section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--foreground);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      color: white;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.2s;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status-panel {
      font-size: 11px;
      line-height: 1.5;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .status-item span:first-child {
      color: #94a3b8;
    }

    .status-item span:last-child {
      font-weight: 600;
    }

    .footer-note {
      font-size: 9px;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
      </svg>
    </div>
    <div class="logo-text">
      <h1>BlogAutoWrite Helper</h1>
      <p>NEVER COPY-PASTE AGAIN</p>
    </div>
  </div>

  <!-- Settings Section -->
  <div class="section">
    <p class="section-title">연동 설정</p>
    <div class="form-group">
      <label for="serverUrl">백엔드 서버 URL</label>
      <input type="text" id="serverUrl" value="http://localhost:3000" placeholder="http://localhost:3000">
    </div>
    <div class="form-group">
      <label for="postId">포스트 ID (UUID)</label>
      <input type="text" id="postId" placeholder="생성된 포스트 ID 입력">
    </div>
    <div class="form-group" style="margin-top: 12px;">
      <button id="fetchBtn">데이터 불러오기</button>
    </div>
  </div>

  <!-- Result Status Section -->
  <div class="section" id="statusSection" style="display: none;">
    <p class="section-title">데이터 요약</p>
    <div class="status-panel">
      <div class="status-item">
        <span>제목:</span>
        <span id="postTitle" style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">-</span>
      </div>
      <div class="status-item">
        <span>이미지 수:</span>
        <span id="imageCount">0개</span>
      </div>
      <div class="status-item">
        <span>본문 분량:</span>
        <span id="textLength">0자</span>
      </div>
    </div>
    <div style="margin-top: 12px;">
      <button id="injectBtn" disabled>네이버 블로그 주입하기</button>
    </div>
  </div>

  <!-- Footer Note -->
  <div class="footer-note">
    네이버 블로그 글쓰기(스마트에디터 ONE) 탭이 활성화되어 있어야 정상적으로 주입할 수 있습니다.
  </div>

  <script src="popup.js"></script>
</body>
</html>
