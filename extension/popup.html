<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>블로그 작성 도우미</title><link rel="stylesheet" href="popup.css"></head><body>
<h1>네이버로 옮기기</h1>
<p>웹에서 로그인 후 글의 ‘확장 프로그램으로 전송’을 누르세요.</p>
<label>운영 웹 주소<input id="origin" placeholder="https://your-app.example"></label><button id="connect">웹 연결 권한 추가</button>
<h2 id="title">받은 글 없음</h2><p id="summary"></p>
<label>네이버 편집 탭<select id="tabs"></select></label>
<button id="diagnose">에디터 진단</button><textarea id="diagnostics" readonly rows="8" aria-label="개인정보를 제외한 에디터 진단 결과" hidden></textarea><button id="copyDiagnostics" hidden>진단 결과 복사</button>
<p>빈 에디터에서만 입력합니다. Chrome의 디버깅 권한 알림이 표시되며 클립보드가 교체됩니다. 개발자 도구를 닫아 주세요.</p>
<button id="transfer" disabled>서식과 본문 입력</button>
<button id="attach" disabled>이미지 첨부 시도</button><button id="download" disabled>이미지 다운로드</button><p>본문 입력 후 이미지를 별도로 첨부합니다. 실패하면 다운로드 후 직접 첨부하세요. 위치 표시는 확인 후 직접 지워주세요.</p>
<p id="status" role="status"></p><p>자동 발행하지 않습니다. 입력 후 임시저장하고 다시 열어 서식과 내용을 확인하세요.</p>
<script type="module" src="popup.js"></script></body></html>
