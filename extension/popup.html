<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogAutoWrite Helper</title>
  <link rel='stylesheet' href='popup.css'>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
      </svg>
    </div>
    <div class="logo-text">
      <h1>BlogAutoWrite Helper</h1>
      <p>NEVER COPY-PASTE AGAIN</p>
    </div>
  </div>

  <!-- Settings Section -->
  <div class="section">
    <p class="section-title">연동 설정</p>
    <div class="form-group">
      <label for="serverUrl">백엔드 서버 URL</label>
      <input type="text" id="serverUrl" value="http://localhost:3000" placeholder="http://localhost:3000">
    </div>
    <div class="form-group">
      <label for="postId">포스트 ID (UUID)</label>
      <input type="text" id="postId" placeholder="생성된 포스트 ID 입력">
    </div>
    <div class="form-group" style="margin-top: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
        <label for="accessToken" style="margin-bottom: 0;">액세스 토큰 (JWT)</label>
        <span id="syncStatus" style="font-size: 9px; color: #ff4d4f; font-weight: bold;">연동 안 됨</span>
      </div>
      <input type="password" id="accessToken" placeholder="대시보드 로그인 시 자동 동기화됨">
    </div>
    <div class="form-group" style="margin-top: 12px;">
      <button id="fetchBtn">데이터 불러오기</button>
    </div>
  </div>

  <!-- Result Status Section -->
  <div class="section" id="statusSection" style="display: none;">
    <p class="section-title">데이터 요약</p>
    <div class="status-panel">
      <div class="status-item">
        <span>제목:</span>
        <span id="postTitle" style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">-</span>
      </div>
      <div class="status-item">
        <span>이미지 수:</span>
        <span id="imageCount">0개</span>
      </div>
      <div class="status-item">
        <span>본문 분량:</span>
        <span id="textLength">0자</span>
      </div>
    </div>
    <div style="margin-top: 12px;">
      <button id="injectBtn" disabled>네이버 블로그 주입하기</button>
    </div>
  </div>

  <!-- Footer Note -->
  <div class="footer-note">
    네이버 블로그 글쓰기(스마트에디터 ONE) 탭이 활성화되어 있어야 정상적으로 주입할 수 있습니다.
  </div>

  <script src="popup.js"></script>
</body>
</html>
